services:
  element:
    image: docker.io/vectorim/element-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ELEMENT_PORT:-8081}:80"
    configs:
      - source: element_config
        target: /app/config.json

  homeserver:
    image: ghcr.io/continuwuity/continuwuity:latest
    restart: unless-stopped
    command: /sbin/conduwuit
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:${HOMESERVER_PORT:-8008}:${HOMESERVER_PORT:-8008}"
    volumes:
      - db:/var/lib/continuwuity
      - ./continuwuity-resolv.conf:/etc/resolv.conf
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: ${HOMESERVER_PORT:-8008}
      CONTINUWUITY_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CONTINUWUITY_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      CONTINUWUITY_WELL_KNOWN: |
        { client = "https://${MATRIX_SERVER_NAME}", server = "${MATRIX_SERVER_NAME}:443" }

configs:
  element_config:
    content: |
      {
        "default_server_config": {
          "m.homeserver": {
            "base_url": "https://${MATRIX_SERVER_NAME}",
            "server_name": "${MATRIX_SERVER_NAME}"
          }
        },
        "brand": "Element",
        "disable_custom_urls": false,
        "disable_guests": true,
        "showLabsSettings": true
      }

volumes:
  db:

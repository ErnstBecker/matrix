services:
  caddy:
    image: docker.io/caddy:latest
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${ELEMENT_PORT:-8443}:8443"
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME}
      HOMESERVER_PORT: ${HOMESERVER_PORT:-8008}
      ELEMENT_PORT: ${ELEMENT_PORT:-8443}
    networks:
      - proxy
    volumes:
      - ./caddy-data:/data
      - ./caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    restart: unless-stopped

  element:
    image: docker.io/vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ./element-config.json:/app/config.json
    networks:
      - proxy

  homeserver:
    image: ghcr.io/continuwuity/continuwuity:latest
    restart: unless-stopped
    command: /sbin/conduwuit
    stdin_open: true
    tty: true
    volumes:
      - db:/var/lib/continuwuity
      - ./continuwuity-resolv.conf:/etc/resolv.conf
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: ${HOMESERVER_PORT:-8008}
      CONTINUWUITY_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CONTINUWUITY_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      CONTINUWUITY_WELL_KNOWN: |
          {
          client=https://${MATRIX_SERVER_NAME},
          server=${MATRIX_SERVER_NAME}:443
          }
    networks:
      - proxy

networks:
  proxy:

volumes:
  db:
